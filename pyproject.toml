[project]
name = "adityacli"
version = "2.0.0"
description = "A local-first AI developer assistant."
readme = "README.md"
requires-python = ">=3.12"


authors = [
    { name = "Aditya Saxena" }
]


dependencies = [
    "rich>=14.0.0",
    "openai>=1.100.0",
    "ddgs>=9.5.5",
    "textual>=6.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pip>=26.2,<27",
]

[project.scripts]
aditya = "adityacli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"adityacli.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "temp/pytest-cache"
