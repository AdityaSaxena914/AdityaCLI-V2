[project]
name = "adityacli"
version = "2.0.0"
description = "A local-first AI developer assistant."
readme = "README.md"
requires-python = ">=3.12"


authors = [
    { name = "Aditya Saxena" }
]


dependencies = [
    "rich>=14.0.0",
    "openai>=1.100.0",
    "ddgs>=9.5.5",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
]

[project.scripts]
aditya = "adityacli.main:main"